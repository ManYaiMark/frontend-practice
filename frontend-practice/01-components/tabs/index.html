<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabs</title>
    <style>
        .tabs {
            position: relative;
        }
        .tab-content {
            visibility: hidden;
            position: absolute;
            transition: opacity 0.5s ease;
        }
        .tab-content.active {
            visibility:visible;
            opacity: 1;
        }
        .underline {
            position: absolute;
            bottom: 0;
            height: 3px;
            background: #15a1e7;
            transition: transform 0.3s ease, width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="tabs">
        <button class="tab-btn active">Tab 1</button>
        <button class="tab-btn">Tab 2</button>
        <button class="tab-btn">Tab 3</button>
        <div class="underline"></div>
    </div>

    <div class="tab-content active">เนื้อหา 1</div>
    <div class="tab-content">เนื้อหา 2</div>
    <div class="tab-content">เนื้อหา 3</div>
</body>
<script>
    const content = document.querySelectorAll('.tab-content')
    const underline = document.querySelector('.underline')
    const firstBtn = document.querySelector('.tab-btn.active')
    // const tab_btn = document.querySelectorAll('.tab-btn')
    
    let offsetWidth = 20
    let offsetLeft = 20

    function moveUnderline(btn) {
        underline.style.width = btn.offsetWidth + 'px'
        underline.style.transform = `translateX(${btn.offsetLeft}px)`
    }
    moveUnderline(firstBtn)

    document.querySelectorAll('.tab-btn').forEach((btn,index) => {
        // console.log(btn.textContent);
        // console.log(btn);
        btn.addEventListener('click', () => {
            content.forEach(content => content.classList.remove('active'))
            content[index].classList.toggle('active')
            moveUnderline(btn)
        })
    });
    

    // for (const element of tab_btn) {
    //     console.log(element.value); 
    // }
</script>
</html>
