<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>accordion</title>
    <style>
        .accordion-content p {
            padding: 6px 8px;
            cursor: pointer;
            border-radius: 4px;
            border: 1px black;
            background-color: black;
            color: white;
        }
        .accordion-content {
            display: none;
        }
        .accordion-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="accordion">

    <div class="accordion-item">
        <button  class="accordion-btn">หัวข้อ 1 ▼</button>
        <div class="accordion-content">
            <p>เนื้อหา 1</p>
        </div>
    </div>

    <div class="accordion-item">
        <button  class="accordion-btn">หัวข้อ 2 ▼</button>
        <div class="accordion-content">
            <p>เนื้อหา 2</p>
        </div>
    </div>

    <div class="accordion-item">
        <button  class="accordion-btn">หัวข้อ 3 ▼</button>
        <div class="accordion-content">
            <p>เนื้อหา 3</p>
        </div>
    </div>

</div>
</body>
<script>
    const button = document.querySelectorAll('.accordion-btn')
    const contents = document.querySelectorAll('.accordion-content')

    button.forEach((btn,index) => {
        btn.addEventListener('click',() =>{
            const isOpen = contents[index].classList.contains('active')

            contents.forEach(content => content.classList.remove('active'))
            
            if (!isOpen) {
                contents[index].classList.add('active')
            }
        })
    })

</script>
</html>
