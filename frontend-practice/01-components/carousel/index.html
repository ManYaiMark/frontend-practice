<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>carousel</title>
    <style>
        .carousel-wrapper {
            position: relative;
            overflow: hidden;
            width: 660px;
            /* max-width: fit-content; */
            margin-inline: auto;    
        }.carousel {
            display: flex;
        }
        .carousel div {
            flex: 0 0 auto; 
            width: 200px;
            height: 300px;
            /* background: #484747; */
            margin: 10px;
            border-radius: 5px;
            
        }
        .silder {
            margin-top: 50px;
            max-width: fit-content;
            margin-inline: auto;
            
        }
        .silder button {
            background: #15a1e7;
            color: white;
            width: 80px;
            height: 40px;
            border: none;
            border-radius: 5px;
        }
        .carousel > div {
            transition: transform 0.3s ease;   
            display: flex;
            align-items: center;
            justify-content: center;
            
        }
        .is-middle {
            transform: scale(1.15);
            z-index: 1;
            font-size: 22px;
        }
        .card1 {
            background: #dca7a7;
        }
        .card2 {
            background: #97dde4;
        }
        .card3 {
            background: #8dd7bc;
        }
        .card4 {
            background: #aa96de;
        }
        </style>
</head>
<body>
    <div class="carousel-wrapper">
        <div class="carousel">
            <div class="card1">1</div>
            <div class="card2 is-middle">2</div>
            <div class="card3">3</div>
            <div class="card4">4</div>
            <!-- <div class="card5">1</div>
            <div class="card6">2</div>
            <div class="card7">3</div>
            <div class="card8">4</div> -->
        </div>
    </div>
    <div class="silder">
        <button id="perv" class="prev">prev</button>
        <button id="next" class="next">next</button>
    </div>
    <script>
        const carousel = document.querySelector(".carousel")
        const next = document.getElementById("next")
        const perv = document.getElementById("perv")

        const  visibleCards = 3
        const  totalCards = 4
        const cardWidth = 220 

        // let totalSteps  = totalCards - visibleCards + 1
        const startIndex = visibleCards
        let currentIndex = startIndex
        let isTransitioning = false

        const middleOffset = Math.floor(visibleCards / 2)
        const middleIndex = currentIndex + middleOffset

        const originalCards = Array.from(carousel.children)   

        // อัพเดทหลัง 1 2 3
        const cards = carousel.children 
        for (let i = 0 ;i < visibleCards ;i++) {
            const clone = cards[i].cloneNode(true)
            carousel.appendChild(clone)
            
        }
        // อัพเดทหน้า 2 3 4
        for (let i = 1;i <= visibleCards; i++) {
            const clone = originalCards[originalCards.length - i].cloneNode(true)
            carousel.prepend(clone)
        }
        
        // อัพเดท middle 
        function UpdateMiddle() {
            const allCards = carousel.children            
            const middleIndex = currentIndex + middleOffset

            Array.from(allCards).forEach((card, i) => {
                if (i === middleIndex) {
                    card.classList.add('is-middle')
                } else {
                    card.classList.remove('is-middle')
                }
            })
        }
        
        function goTo(index,withTransition = true) {
            if (!withTransition) {
                Array.from(carousel.children).forEach(card => {
                    card.style.transition = 'none'
                })
            }

            UpdateMiddle()
            carousel.style.transition = withTransition ? 'transform 0.4s ease' : 'none'
            carousel.style.transform = `translateX(-${cardWidth * index}px)`

            if (!withTransition) {
                carousel.offsetHeight
                Array.from(carousel.children).forEach(card => {
                    card.style.transition = ''
                })
            }
        }
        
        // อัพเดิม
        UpdateMiddle()
        // เนื่องจากเพ่ิมด้านหน้า เลยทำการใช้เพื่อทำการกลับไปในจุดที่ควรจะเป็น 
        goTo(currentIndex, false)

        next.addEventListener('click', () => {
            // if (currentIndex < totalCards - visibleCards) {
                // currentIndex = (currentIndex + 1) % totalSteps
                if (isTransitioning) return
                currentIndex++
                goTo(currentIndex)
                console.log('next')
                console.log(currentIndex)

                // carousel.style.transform = `translateX(-${220 * currentIndex}px)`
                if (currentIndex >= totalCards + visibleCards) {
                    isTransitioning = true
                }
            // }
        })

        perv.addEventListener('click', () => {
            // if (currentIndex > 0) {
                // currentIndex = (currentIndex - 1 + totalSteps) % totalSteps
                if (isTransitioning) return
                
                currentIndex--
                goTo(currentIndex)
                console.log('prev')
                console.log(currentIndex)
                
                if (currentIndex <= 0 ) {
                    isTransitioning = true
                }
                // carousel.style.transform = `translateX(-${220 * currentIndex}px)`
            // }
            
        })    

        // ทำงานตลอดเวลา
        carousel.addEventListener('transitionend', () => {
            console.log('transitionend fired, currentIndex =', currentIndex)   // เพิ่มบรรทัดนี้
            if (currentIndex >= totalCards  + visibleCards) {
                currentIndex = startIndex
                goTo(currentIndex, false)
            } 
            // อัพเดทหากเป็น 0 อัพเดทให้เป็น
            if (currentIndex <= 0) {
                currentIndex = startIndex + totalCards - 3
                goTo(currentIndex, false)
            }
            isTransitioning = false
        })
        
        
    </script>
</body>
</html>
