<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>carousel</title>
    <style>
        .carousel-wrapper {
            position: relative;
            overflow: hidden;
            width: 660px;
            /* max-width: fit-content; */
            margin-inline: auto;    
        }.carousel {
            display: flex;
        }
        .carousel div {
            flex: 0 0 auto; 
            width: 200px;
            height: 300px;
            /* background: #484747; */
            margin: 10px;
            border-radius: 5px;
            
        }
        .silder {
            margin-top: 50px;
            max-width: fit-content;
            margin-inline: auto;
            
        }
        .silder button {
            background: #15a1e7;
            color: white;
            width: 80px;
            height: 40px;
            border: none;
            border-radius: 5px;
        }
        .card1 {
            background: #dca7a7;
        }
        .card2 {
            background: #97dde4;
        }
        .card3 {
            background: #8dd7bc;
        }
        .card4 {
            background: #aa96de;
        }
        </style>
</head>
<body>
    <div class="carousel-wrapper">
        <div class="carousel">
            <div class="card1">1</div>
            <div class="card2">2</div>
            <div class="card3">3</div>
            <div class="card4">4</div>
            <!-- <div class="card5">1</div>
            <div class="card6">2</div>
            <div class="card7">3</div>
            <div class="card8">4</div> -->
        </div>
    </div>
    <div class="silder">
        <button id="perv" class="prev">prev</button>
        <button id="next" class="next">next</button>
    </div>
    <script>
        const carousel = document.querySelector(".carousel")
        const next = document.getElementById("next")
        const perv = document.getElementById("perv")

        let currentIndex = 0
        let totalCards = 4
        let visibleCards = 3
        let totalSteps  = totalCards - visibleCards + 1
        // let index = 

        next.addEventListener('click', () => {
            // if (currentIndex < totalCards - visibleCards) {
                currentIndex = (currentIndex + 1) % totalSteps
                carousel.style.transform = `translateX(-${220 * currentIndex}px)`
                console.log('next')
                console.log(currentIndex)
            // }
        })

        perv.addEventListener('click', () => {
            // if (currentIndex > 0) {
                currentIndex = (currentIndex - 1 + totalSteps) % totalSteps
                carousel.style.transform = `translateX(-${220 * currentIndex}px)`
                console.log('prev')
                console.log(currentIndex)
            // }
            
        })    
        
        
        // carousel.forEach((index) => {
        //     carousel.style.transform = `translateX(-${220 * index}px)`
        // })

        
    </script>
</body>
</html>
