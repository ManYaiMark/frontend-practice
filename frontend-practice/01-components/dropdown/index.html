<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dropdown</title>
    <style>
        button {
            padding: 8px 16px;
            background-color: #0a1628;
            color:  #4fc3f7;
            border: 1px solid  #0a1628;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: #4fc3f7;
            color: #0a1628;
        }
        .dropdown-menu {
            display: none;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            pointer-events: none;
            list-style: none;
            margin: 4px 0 0 0;
            padding: 4px;
            background: #0a1628;
            border: 1px solid #1e3a5f;
            border-radius: 6px;
            min-width: 150px;
        }
        .dropdown-menu li {
            padding: 8px 12px;
            color: #e0f4ff;
            cursor: pointer;
            border-radius: 4px;
        }

        .dropdown-menu li:hover {
            background: #4fc3f7;
            color: #0a1628;
        }
        .dropdown-menu.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        select {
            padding: 8px 16px;
            background: #0a1628;
            color: #e0f4ff;
            border: 1px solid #1e3a5f;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            outline: none;
        }

        select:focus {
            border-color: #4fc3f7;
        }

        select option {
            background: #0a1628;
            color: #e0f4ff;
    }
    </style>
</head>
<body>
    <div id="dropdown" class="dropdown">
        <button id="dropdownMenu">เลือกภาษา ▼</button>
        
        <ul id="menu" class="dropdown-menu" >
            <li>ภาษาไทย</li>
            <li>English</li>
            <li>日本語</li>
        </ul>
        
    </div>
    <div class="easy-dropdown">
        <select id="selected-dropdown" class="selected-dropdown">
            <option>ภาษาไทย</option>
            <option>English</option>
            <option>日本語</option>
        </select>
    </div>
</body>

<script>
    const selected = []

    const dropdownMenu = document.getElementById('dropdownMenu')
    const dropdown = document.getElementById('dropdown')
    const menu = document.getElementById('menu')


    // เปิด
    dropdownMenu.addEventListener('click', () => {
        menu.classList.toggle('active');
    })

    // ปิด
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.dropdown')) {
        menu.classList.remove('active')
    }
    })


    document.querySelectorAll('.dropdown-menu li').forEach(item => {
        item.addEventListener('click', () => {
            const value = item.textContent

            if (selected.includes(value)) {
                selected.splice(selected.indexOf(value), 1);
                item.style.background = '' ;
            } else {
                selected.push(value);
                item.style.background = '#ccc';
            }

            dropdownMenu.textContent = selected.length
            ? selected.join(', ') + ' ▼'
            : 'เลือกภาษา ▼'
        })
    })

    
</script>
</html>
